name: CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: .NET info
        shell: pwsh
        run: dotnet --info
      - name: Restore
        shell: pwsh
        run: dotnet restore MindCanvas.slnx -p:Platform=x64
      - name: Build
        shell: pwsh
        run: dotnet build MindCanvas.slnx -c Release -p:Platform=x64 --no-restore
      - name: Test
        shell: pwsh
        run: dotnet test MindCanvas.slnx -c Release -p:Platform=x64 --no-build
